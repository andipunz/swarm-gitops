# What repos may deploy onto the Swarm. Baked into the image and used by both
# the controller and `swarm-gitops check` in CI, so devs see the same result
# on their pull request that the controller would give them after merge.

# Images must come from here (checked after normalising "nginx" to
# "docker.io/library/nginx"). Remove the list to allow every registry.
image_prefixes:
  - ghcr.io/example/
  - docker.io/library/        # official images (postgres, redis, nginx, ...)

# External networks a stack may join. "*" = every environment.
external_networks:
  "*": [traefik-public]
  # prod: [traefik-public, monitoring]

# Folders that may be bind-mounted. {repo}, {env} and {stack} are filled in
# per stack, so every stack only reaches its own folder. The part before the
# first placeholder (here /srv/swarm) must exist on every node; everything
# below it is created automatically before a deploy (create: true).
# ${STACK_DATA} in compose files points to the first "create" folder.
bind_mounts:
  - path: /srv/swarm/{repo}/{env}
    create: true
  # - path: /srv/shared/certs        # shared, read-only for everybody
  #   read_only: true
  # - path: /mnt/nas/einsatz         # only for one repository
  #   repos: [einsatz-app]
  # - path: /                        # a whole host filesystem, e.g. node_exporter's
  #   read_only: true                # disk-usage collector - always read-only, and
  #   repos: [observability]         # always scoped to one named service, not the
  #   services: [node-exporter]      # whole repo (required by swarm-gitops itself
  #                                  # for path "/": bind_mounts is per-repo otherwise,
  #                                  # which would hand host-root access to every
  #                                  # other service the repo's compose files define,
  #                                  # present and future)

# Traefik: which hostnames a stack may route. On top of this, a hostname
# belongs to the stack that routes it first (including stacks not managed
# by swarm-gitops); nobody else can use it.
traefik:
  hosts:
    prod: [example.com, "*.example.com"]
    staging: ["*.staging.example.com"]
    sandbox: ["*.sandbox.example.com"]
  reserved:                          # hostname or *.pattern -> the only repository allowed
    example.com: website
    www.example.com: website
  entrypoints: [websecure]

# Publishing ports bypasses Traefik; keep false.
allow_published_ports: false
# Narrow, explicit exceptions to the above - e.g. a log-shipping backend a
# node's own Docker daemon needs to reach directly, outside any overlay
# network. Both mode and repos are required: no "any mode"/"any repo"
# wildcard to reach for by accident.
# published_ports:
#   - published: 3100
#     mode: host
#     repos: [observability]

# Linux capabilities that may be added (without CAP_ prefix).
cap_add: []

# How secrets may be provided. `file:`/`environment:` are never allowed
# (the value would end up in git or the rendered stack), regardless of these.
#
# Plain secrets created ahead of time with `docker secret create` - the
# standard Swarm way, no plugin needed. Not scoped by swarm-gitops: an admin
# who names secrets predictably could let one repo reference another's,
# same as on any plain Swarm today.
allow_external_secrets: true
# Your own secrets driver plugin instead (or in addition), which can scope
# secrets per repo/env using the labels swarm-gitops sets - see the README's
# "Secrets plugin" section. Uncomment once you have one:
# secret_driver: your-org/secrets

max_replicas: 10

# Local volumes may mount these network filesystems via driver_opts.
volume_mount_types: [nfs, nfs4, cifs]
