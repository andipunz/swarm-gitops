# What repos may deploy onto the Swarm. Baked into the image and used by both
# the controller and `swarm-gitops check` in CI, so devs see the same result
# on their pull request that the controller would give them after merge.

# Images must come from here (checked after normalising "nginx" to
# "docker.io/library/nginx"). Remove the list to allow every registry.
image_prefixes:
  - ghcr.io/bergwacht-bayern/
  - docker.io/library/        # official images (postgres, redis, nginx, ...)

# External networks a stack may join. "*" = every environment.
external_networks:
  "*": [traefik-public]
  # prod: [traefik-public, monitoring]

# Folders that may be bind-mounted. {repo}, {env} and {stack} are filled in
# per stack, so every stack only reaches its own folder. The part before the
# first placeholder (here /srv/swarm) must exist on every node; everything
# below it is created automatically before a deploy (create: true).
# ${STACK_DATA} in compose files points to the first "create" folder.
bind_mounts:
  - path: /srv/swarm/{repo}/{env}
    create: true
  # - path: /srv/shared/certs        # shared, read-only for everybody
  #   read_only: true
  # - path: /mnt/nas/einsatz         # only for one repository
  #   repos: [einsatz-app]

# Traefik: which hostnames a stack may route. On top of this, a hostname
# belongs to the stack that routes it first (including stacks not managed
# by swarm-gitops); nobody else can use it.
traefik:
  hosts:
    prod: [bergwacht-bayern.de, "*.bergwacht-bayern.de"]
    staging: ["*.staging.bergwacht-bayern.de"]
    sandbox: ["*.sandbox.bergwacht-bayern.de"]
  reserved:                          # hostname or *.pattern -> the only repository allowed
    bergwacht-bayern.de: website
    www.bergwacht-bayern.de: website
  entrypoints: [websecure]

# Publishing ports bypasses Traefik; keep false.
allow_published_ports: false

# Linux capabilities that may be added (without CAP_ prefix).
cap_add: []

# Every secret must come from your secrets plugin.
secret_driver: bergwacht/secrets

max_replicas: 10

# Local volumes may mount these network filesystems via driver_opts.
volume_mount_types: [nfs, nfs4, cifs]
